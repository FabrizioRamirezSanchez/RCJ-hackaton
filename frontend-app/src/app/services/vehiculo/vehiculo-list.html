<div class="container">
  <h2>Gestión de Vehículos</h2>
  
  <button class="btn btn-primary" (click)="mostrarCrear()" *ngIf="!mostrarFormulario">
    + Nuevo Vehículo
  </button>

  <div class="form-container" *ngIf="mostrarFormulario">
    <h3>{{ editando ? 'Editar Vehículo' : 'Nuevo Vehículo' }}</h3>
    <form [formGroup]="vehiculoForm" (ngSubmit)="guardar()">
      <div class="form-group">
        <label>Placa:</label>
        <input type="text" formControlName="placa" required>
      </div>
      <div class="form-group">
        <label>Marca:</label>
        <input type="text" formControlName="marca" required>
      </div>
      <div class="form-group">
        <label>Modelo:</label>
        <input type="text" formControlName="modelo" required>
      </div>
      <div class="form-group">
        <label>Año:</label>
        <input type="number" formControlName="anio" required>
      </div>
      <div class="form-group">
        <label>Color:</label>
        <input type="text" formControlName="color" required>
      </div>
      <div class="form-group">
        <label>Precio por Día:</label>
        <input type="number" formControlName="precioPorDia" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-success" [disabled]="vehiculoForm.invalid">
          {{ editando ? 'Actualizar' : 'Guardar' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="cancelar()">
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <div class="table-container" *ngIf="!mostrarFormulario">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Placa</th>
          <th>Marca</th>
          <th>Modelo</th>
          <th>Año</th>
          <th>Color</th>
          <th>Precio/Día</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let v of vehiculos; let i = index">
          <td>{{ v.id }}</td>
          <td>{{ v.placa }}</td>
          <td>{{ v.marca }}</td>
          <td>{{ v.modelo }}</td>
          <td>{{ v.anio }}</td>
          <td>{{ v.color }}</td>
          <td>{{ v.precioPorDia }}</td>
          <td [class]="'status-' + v.estado.toLowerCase()">{{ v.estado }}</td>
          <td class="actions">
            <button class="btn btn-small btn-edit" (click)="mostrarEditar(v)" title="Editar">✏️</button>
            <button class="btn btn-small btn-delete" (click)="eliminarLogico(v.id)" title="Eliminar" *ngIf="v.estado === 'DISPONIBLE'">🗑️</button>
            <button class="btn btn-small btn-restore" (click)="restaurar(v.id)" title="Restaurar" *ngIf="v.estado === 'INACTIVO'">♻️</button>
          </td>
        </tr>
        <tr *ngIf="vehiculos.length === 0">
          <td colspan="9">No hay vehículos disponibles.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
