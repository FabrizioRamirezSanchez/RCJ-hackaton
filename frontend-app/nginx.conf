server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /alquileres {
        try_files $uri $uri/ /alquileres/index.html;
    }

    location /clientes {
        try_files $uri $uri/ /clientes/index.html;
    }

    location /vehiculos {
        try_files $uri $uri/ /vehiculos/index.html;
    }

    # Proxy para API de vehículos
    location /api/vehiculos {
        proxy_pass http://hct-vehiculo-ramirez-fabrizio-service.hct-vehiculo-ramirez-fabrizio.svc.cluster.local:8080/api/vehiculos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para API de clientes
    location /api/clientes {
        proxy_pass http://hct-cliente-ramirez-fabrizio-service.hct-cliente-ramirez-fabrizio.svc.cluster.local:8080/api/clientes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para API de alquileres
    location /api/alquileres {
        proxy_pass http://hct-alquiler-ramirez-fabrizio-service.hct-alquiler-ramirez-fabrizio.svc.cluster.local:8080/api/alquileres;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
