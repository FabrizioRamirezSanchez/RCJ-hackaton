apiVersion: apps/v1
kind: Deployment
metadata:
  name: hct-frontend-ramirez-fabrizio-deployment
  namespace: hct-frontend-ramirez-fabrizio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hct-frontend-ramirez-fabrizio
  template:
    metadata:
      labels:
        app: hct-frontend-ramirez-fabrizio
    spec:
      containers:
      - name: hct-frontend-ramirez-fabrizio-container
        image: fabrizioleonardoramirez/hct-frontend:latest
        ports:
        - containerPort: 80